<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f0e" />
    <title>Vigil — Certificate Lifecycle Management</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vigil:theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var p = localStorage.getItem('vigil:palette');
          var known = { steel: 1, console: 1, aubergine: 1, ember: 1, indigo: 1, arctic: 1, moss: 1, signal: 1, graphite: 1, parchment: 1 };
          document.documentElement.setAttribute('data-palette', known[p] ? p : 'console');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
